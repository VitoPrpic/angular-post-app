<article class="post-card" [class]="'post-card ' + post.accent" (click)="openPost.emit(post)">
  @if (post.imageDataUrl) {
    <div class="card-media">
      <img [src]="post.imageDataUrl" [alt]="'Naslovna slika za ' + post.title" />
      <span aria-hidden="true">{{ post.category.charAt(0) }}</span>
    </div>
  } @else {
    <div class="card-accent" aria-hidden="true">
      <span>{{ post.category.charAt(0) }}</span>
      <span>✦</span>
    </div>
  }

  <div class="card-body">
    <div class="card-meta">
      <span>{{ post.category }}</span>
      <span>{{ post.publishedAt | date: 'dd.MM.yyyy.' }}</span>
    </div>

    <h3>{{ post.title }}</h3>
    <p>{{ post.excerpt }}</p>

    <div class="card-footer">
      <span>{{ post.readingTime }} min čitanja</span>
      <div class="card-actions">
        <button class="read-button" type="button">Pročitaj <span aria-hidden="true">↗</span></button>
        <button
          class="remove-button"
          type="button"
          (click)="$event.stopPropagation(); removePost.emit(post.id)"
          [attr.aria-label]="'Ukloni post ' + post.title"
        >
          Ukloni
        </button>
      </div>
    </div>
  </div>
</article>
